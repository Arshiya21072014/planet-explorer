<html>
    <head>
        <title>My Planet Explorer Page</title>
        <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
        <style>
            body{
                background-color: beige;
            }
            .navbar{
                background-color: blue;
            }
            .navbar-brand,.nav-link{
                color: blueviolet;
            }
        </style>
    </head>
    <body>
        <nav class="navbar navbar-expand-sm">
            <a href="#" class="navbar-brand">Planet Explorer</a>
            <ul class="navbar-nav">
                <li class="nav-item"><a href="#" class="nav-link">Home</a></li>
                <li class="nav-item"><a href="#" class="nav-link">Planets</a></li>
                <li class="nav-item"><a href="#" class="nav-link">Stars</a></li>
                <li class="nav-item"><a href="#" class="nav-link">Galaxies</a></li>
            </ul>
        </nav>
        <div class="container">
            <h4 class="section-title">Scanning the galaxy.....</h4>
            <div class="spinner-border text-primary" role="status"></div>
            <div class="spinner-border text-success" role="status"></div>
            <div class="spinner-border text-danger" role="status"></div>
            <h4 class="section-title">Featured Planets</h4>
            <div class="row">
                <div class="col-md-4">
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title">Earth</h5>
                            <p class="card-text">Our home planet-the only one known to have life!</p>
                            <a href="#" class="btn btn-primary">Explore</a>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title">Mars</h5>
                            <p class="card-text">The red planet-one day humans might live here!</p>
                            <a href="#" class="btn btn-success">Explore</a>
                        </div>
                    </div>
                </div>
            </div>
            <h4 class="section-title">Browse more planets</h4>
            <ul class="pagination">
                <li class="page-item"><a href="#" class="page-link">Previous</a></li>
                <li class="page-item"><a href="#" class="page-link">1</a></li>
                <li class="page-item"><a href="#" class="page-link">2</a></li>
                <li class="page-item"><a href="#" class="page-link">3</a></li>
                <li class="page-item"><a href="#" class="page-link">Next</a></li>
            </ul>
        </div>
    </body>
</html>
